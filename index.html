<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Gift</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        margin-bottom: 30px;
    }

    .buttons {
        display: flex;
        gap: 20px;
    }

    button {
        padding: 15px 30px;
        font-size: 18px;
        border: none;
        border-radius: 15px;
        cursor: pointer;
    }

    .play {
        background: #1DB954;
        color: white;
    }

    .pause {
        background: #444;
        color: white;
    }
</style>
</head>

<body>

<h1>🎵 A Song For You ❤️</h1>

<audio id="music" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="buttons">
    <button class="play" onclick="playMusic()">▶ Play</button>
    <button class="pause" onclick="pauseMusic()">⏸ Pause</button>
</div>

<audio id="player" controls></audio>
<button onclick="playSong()">Play</button>

<script>
const songs = {
  "1": "songs/song1.mp3",
  "2": "songs/song2.mp3",
  "romantic": "songs/romantic.mp3"
};

const params = new URLSearchParams(window.location.search);
const songId = params.get("song") || "1";

const player = document.getElementById("player");
player.src = songs[songId] || songs["1"];

function playSong() {
  player.play();
}
</script>

</body>
</html>
