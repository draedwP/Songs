<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFC Music</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #333, #050505);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .background {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(35px) brightness(0.35);
      transform: scale(1.15);
      z-index: -2;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.8));
      z-index: -1;
    }

    .player {
      width: 100%;
      max-width: 390px;
      padding: 28px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(24px);
      box-shadow: 0 25px 70px rgba(0,0,0,.45);
      text-align: center;
      border: 1px solid rgba(255,255,255,.18);
    }

    .cover-wrap {
      width: 240px;
      height: 240px;
      margin: 0 auto 26px;
      border-radius: 50%;
      padding: 10px;
      background: rgba(255,255,255,.15);
      box-shadow: 0 20px 40px rgba(0,0,0,.4);
    }

    .cover {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      animation: spin 10s linear infinite;
      animation-play-state: paused;
    }

    .playing .cover {
      animation-play-state: running;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    p {
      opacity: .75;
      margin-bottom: 26px;
      font-size: 15px;
    }

    .button {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: none;
      background: white;
      color: black;
      font-size: 34px;
      cursor: pointer;
      box-shadow: 0 15px 35px rgba(0,0,0,.35);
      margin-bottom: 24px;
    }

    .progress {
      width: 100%;
      accent-color: white;
      cursor: pointer;
    }

    .time {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      opacity: .7;
      margin-top: 8px;
    }

    .hint {
      margin-top: 18px;
      font-size: 13px;
      opacity: .6;
    }
  </style>
</head>

<body>
  <div class="background" id="background"></div>
  <div class="overlay"></div>

  <div class="player" id="playerBox">
    <div class="cover-wrap">
      <img class="cover" id="cover" src="" alt="Cover" />
    </div>

    <h1 id="title">Loading...</h1>
    <p id="artist">NFC Music Gift</p>

    <button class="button" id="playBtn">▶</button>

    <input class="progress" id="progress" type="range" value="0" min="0" max="100" />

    <div class="time">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="hint">Tap play to start the music</div>
  </div>

  <audio id="audio"></audio>

  <script>
    const songs = {
      "1": {
        title: "Song One",
        artist: "For You",
        file: "songs/song1.mp3",
        cover: "covers/cover1.jpg"
      },
      "2": {
        title: "Song Two",
        artist: "Special Moment",
        file: "songs/song2.mp3",
        cover: "covers/cover2.jpg"
      },
      "romantic": {
        title: "Romantic Song",
        artist: "With Love",
        file: "songs/romantic.mp3",
        cover: "covers/romantic.jpg"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const songId = params.get("song") || "1";
    const song = songs[songId] || songs["1"];

    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("playBtn");
    const playerBox = document.getElementById("playerBox");
    const progress = document.getElementById("progress");

    document.getElementById("title").textContent = song.title;
    document.getElementById("artist").textContent = song.artist;
    document.getElementById("cover").src = song.cover;
    document.getElementById("background").style.backgroundImage = `url('${song.cover}')`;

    audio.src = song.file;

    playBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = "⏸";
        playerBox.classList.add("playing");
      } else {
        audio.pause();
        playBtn.textContent = "▶";
        playerBox.classList.remove("playing");
      }
    });

    audio.addEventListener("timeupdate", () => {
      progress.value = (audio.currentTime / audio.duration) * 100 || 0;
      document.getElementById("currentTime").textContent = formatTime(audio.currentTime);
      document.getElementById("duration").textContent = formatTime(audio.duration);
    });

    progress.addEventListener("input", () => {
      audio.currentTime = (progress.value / 100) * audio.duration;
    });

    audio.addEventListener("ended", () => {
      playBtn.textContent = "▶";
      playerBox.classList.remove("playing");
      progress.value = 0;
    });

    function formatTime(time) {
      if (isNaN(time)) return "0:00";
      const minutes = Math.floor(time / 60);
      const seconds = Math.floor(time % 60).toString().padStart(2, "0");
      return `${minutes}:${seconds}`;
    }
  </script>
</body>
</html>
