<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Gift</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        margin-bottom: 30px;
    }

    .buttons {
        display: flex;
        gap: 20px;
    }

    button {
        padding: 15px 30px;
        font-size: 18px;
        border: none;
        border-radius: 15px;
        cursor: pointer;
    }

    .play {
        background: #1DB954;
        color: white;
    }

    .pause {
        background: #444;
        color: white;
    }
</style>
</head>

<body>

<h1>🎵 A Song For You ❤️</h1>

<audio id="music" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="buttons">
    <button class="play" onclick="playMusic()">▶ Play</button>
    <button class="pause" onclick="pauseMusic()">⏸ Pause</button>
</div>

<script>
const music = document.getElementById('music');

// Try autoplay
window.addEventListener('load', () => {
    music.play().catch(() => {
        console.log("Autoplay blocked");
    });
});

// Play function
function playMusic() {
    music.play();
}

// Pause function
function pauseMusic() {
    music.pause();
}

// Extra trick for iPhone:
// first touch anywhere starts music
document.body.addEventListener('touchstart', () => {
    music.play();
}, { once: true });

</script>

</body>
</html>
