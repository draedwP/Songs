<!DOCTYPE html>
<html>
<head>
  <title>For You ❤️</title>

  <style>
    body {
      background: black;
      color: white;
      text-align: center;
      font-family: Arial;
      margin-top: 100px;
    }

    button {
      padding: 20px 40px;
      font-size: 24px;
      border-radius: 20px;
      border: none;
    }
  </style>
</head>

<body>

<h1>🎵 A Song For You ❤️</h1>

<audio id="music" autoplay>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<button onclick="playMusic()">
▶ Play Music
</button>

<script>
  const music = document.getElementById('music');

  function playMusic() {
    music.play();
  }

  window.onload = () => {
    music.play().catch(() => {
      console.log("Autoplay blocked");
    });
  };
</script>

</body>
</html>
